{% set resource_fields = h.get_resource_fields(resource) %}
{% if resource_fields %}
<div
  class="resource-view-filters"
  data-module="resource_view_filters_override"
  data-module-resource-id="{{ resource['bq_table_name'] }}"
  data-module-fields="{{ h.dump_json(h.get_resource_fields(resource)) }}"
  >
</div>
{% else %}
<div class="resource-view-filters">
  <p class="empty">{{ _('No fields to display') }}</p>
</div>
{% endif %}
{% asset 'dataexplorer/dataexplorer-filters-override-js' %}
